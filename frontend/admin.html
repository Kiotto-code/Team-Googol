<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Box Admin Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a202c 100%);
            color: white;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Login Styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1419 0%, #1a202c 100%);
        }

        .login-card {
            background: rgba(26, 32, 44, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-title {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(15, 20, 25, 0.5);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        /* Dashboard Styles */
        .dashboard {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            border-radius: 8px;
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(26, 32, 44, 0.6);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .online { color: #10b981; }
        .offline { color: #ef4444; }
        .warning { color: #f59e0b; }
        .info { color: #3b82f6; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: rgba(26, 32, 44, 0.6);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .box-card {
            background: rgba(26, 32, 44, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .box-card:hover {
            transform: translateY(-3px);
        }

        .box-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
        }

        .box-id {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: auto;
        }

        .box-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            font-weight: 500;
        }

        .last-accessed {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .charts-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .boxes-grid {
                grid-template-columns: 1fr;
            }

            .logout-btn {
                position: static;
                margin-bottom: 20px;
                width: 100px;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .box-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Interface -->
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <h1 class="login-title">Admin Login</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <div class="container">
            <div class="header">
                <h1>Smart Box Dashboard</h1>
                <p>Real-time monitoring and management</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value online" id="onlineBoxes">0</div>
                    <div class="stat-label">Online Boxes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value offline" id="offlineBoxes">0</div>
                    <div class="stat-label">Offline Boxes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value warning" id="openDoors">0</div>
                    <div class="stat-label">Open Doors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value info" id="totalLoad">0</div>
                    <div class="stat-label">Total Load</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3 class="chart-title">Status Overview</h3>
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3 class="chart-title">Load Distribution</h3>
                    <canvas id="loadChart"></canvas>
                </div>
            </div>

            <div id="boxesContainer">
                <div class="loading">Loading box data...</div>
            </div>
        </div>
    </div>

    <script>
        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            if (username === 'admin' && password === 'admin') {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadDashboard();
            } else {
                errorDiv.textContent = 'Invalid username or password';
                setTimeout(() => errorDiv.textContent = '', 3000);
            }
        });

        function logout() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Dashboard functionality
        let statusChart, loadChart;

        async function loadDashboard() {
            try {
                // For demo purposes, using mock data since we can't make actual API calls
                // Replace this with actual fetch when implementing
                const mockData = {
                    boxes: [
                        {
                            box_id: 1,
                            status: true,
                            door_status: false,
                            location: "Lobby",
                            load: 0,
                            last_accessed: "2025-09-24 15:45:12"
                        },
                        {
                            box_id: 2,
                            status: false,
                            door_status: true,
                            location: "Warehouse",
                            load: 3,
                            last_accessed: "2025-09-24 15:50:01"
                        },
                        {
                            box_id: 3,
                            status: true,
                            door_status: false,
                            location: "Reception",
                            load: 5,
                            last_accessed: "2025-09-24 16:20:33"
                        },
                        {
                            box_id: 4,
                            status: true,
                            door_status: true,
                            location: "Storage Room",
                            load: 2,
                            last_accessed: "2025-09-24 14:30:15"
                        }
                    ]
                };

                // Uncomment this when you want to use the actual API
                // const response = await fetch('/box/all', { method: 'POST' });
                // const data = await response.json();
                
                updateStats(mockData.boxes);
                updateCharts(mockData.boxes);
                renderBoxes(mockData.boxes);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('boxesContainer').innerHTML = 
                    '<div class="loading" style="color: #ef4444;">Error loading data</div>';
            }
        }

        function updateStats(boxes) {
            const online = boxes.filter(box => box.status).length;
            const offline = boxes.filter(box => !box.status).length;
            const openDoors = boxes.filter(box => box.door_status).length;
            const totalLoad = boxes.reduce((sum, box) => sum + box.load, 0);

            document.getElementById('onlineBoxes').textContent = online;
            document.getElementById('offlineBoxes').textContent = offline;
            document.getElementById('openDoors').textContent = openDoors;
            document.getElementById('totalLoad').textContent = totalLoad;
        }

        function updateCharts(boxes) {
            const online = boxes.filter(box => box.status).length;
            const offline = boxes.filter(box => !box.status).length;

            // Status Chart
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            if (statusChart) statusChart.destroy();
            
            statusChart = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Online', 'Offline'],
                    datasets: [{
                        data: [online, offline],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: 'white' }
                        }
                    }
                }
            });

            // Load Chart
            const loadCtx = document.getElementById('loadChart').getContext('2d');
            if (loadChart) loadChart.destroy();
            
            loadChart = new Chart(loadCtx, {
                type: 'bar',
                data: {
                    labels: boxes.map(box => `Box ${box.box_id}`),
                    datasets: [{
                        label: 'Load',
                        data: boxes.map(box => box.load),
                        backgroundColor: boxes.map((box, index) => {
                            const colors = ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
                            return colors[index % colors.length];
                        }),
                        borderRadius: 8,
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: 'white' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: 'white' }
                        }
                    }
                }
            });
        }

        function renderBoxes(boxes) {
            const container = document.getElementById('boxesContainer');
            container.innerHTML = boxes.map(box => `
                <div class="box-card">
                    <div class="box-header">
                        <div class="box-id">Box ${box.box_id}</div>
                        <div class="status-indicator ${box.status ? 'online' : 'offline'}" 
                             style="background-color: ${box.status ? '#10b981' : '#ef4444'}"></div>
                    </div>
                    <div class="box-details">
                        <div class="detail-item">
                            <div class="detail-value ${box.door_status ? 'warning' : 'online'}">
                                ${box.door_status ? 'Open' : 'Closed'}
                            </div>
                            <div class="detail-label">Door Status</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-value info">${box.load}</div>
                            <div class="detail-label">Load</div>
                        </div>
                        <div class="location">${box.location}</div>
                        <div class="last-accessed">Last accessed: ${box.last_accessed}</div>
                    </div>
                </div>
            `).join('');
            
            container.className = 'boxes-grid';
        }

        // Auto-refresh every 30 seconds (when using real API)
        // setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
