<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="https://cdn.tailwindcss.com"></script>
	<title>FINDR | Search Lost Items</title>
	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
		rel="stylesheet">
	<style>
		/* --- EXACT STYLES FROM ORIGINAL --- */
		body {
			font-family: "Poppins", sans-serif;
			background-color: #0d0d0d;
			color: #fff;
		}

		.logo-font {
			font-family: "Space Grotesk", sans-serif;
		}

		.glass-card {
			background-color: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(16px);
			border-radius: 1rem;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
		}

		.slide-enter {
			opacity: 0;
			transform: translateY(25px);
		}

		.slide-enter-active {
			opacity: 1;
			transform: translateY(0);
			transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
		}

		input,
		textarea {
			background-color: rgba(255, 255, 255, 0.08);
			color: #fff;
			border: 1px solid rgba(255, 255, 255, 0.15);
			transition: all 0.2s ease;
		}

		input::placeholder,
		textarea::placeholder {
			color: rgba(255, 255, 255, 0.4);
		}

		input:focus,
		textarea:focus {
			outline: none;
			border-color: #3b82f6;
			background-color: rgba(255, 255, 255, 0.12);
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
		}

		.btn-primary {
			background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
			transition: all 0.3s ease;
			box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
		}

		.btn-primary:hover:not(:disabled) {
			background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
			box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
			transform: translateY(-1px);
		}

		.btn-primary:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.divider {
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
		}

		.error-message {
			background-color: rgba(239, 68, 68, 0.1);
			border: 1px solid rgba(239, 68, 68, 0.3);
			color: #fca5a5;
			padding: 0.75rem 1rem;
			border-radius: 0.5rem;
			margin-bottom: 1rem;
			font-size: 0.875rem;
		}

		.success-message {
			background-color: rgba(34, 197, 94, 0.1);
			border: 1px solid rgba(34, 197, 94, 0.3);
			color: #86efac;
			padding: 0.75rem 1rem;
			border-radius: 0.5rem;
			margin-bottom: 1rem;
			font-size: 0.875rem;
		}

		.header-glow {
			text-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
		}

		.result-card {
			background-color: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 0.75rem;
			overflow: hidden;
			transition: transform 0.2s ease, border-color 0.2s ease;
		}

		.result-card:hover {
			transform: translateY(-2px);
			border-color: rgba(59, 130, 246, 0.3);
		}

		.result-image {
			width: 100%;
			aspect-ratio: 5 / 7;
			object-fit: cover;
			background-color: #1a1a1a;
			cursor: pointer;
		}

		.result-info {
			padding: 1rem;
		}

		.result-score {
			font-size: 0.875rem;
			color: #60a5fa;
			margin-top: 0.25rem;
		}

		.spinner {
			border: 2px solid rgba(255, 255, 255, 0.1);
			border-top: 2px solid #3b82f6;
			border-radius: 50%;
			width: 20px;
			height: 20px;
			animation: spin 0.8s linear infinite;
			display: inline-block;
			margin-right: 0.5rem;
		}

		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		.fade-in {
			animation: fadeIn 0.3s ease;
		}

		@keyframes fadeIn {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		/* Modal styles */
		.modal-overlay {
			position: fixed;
			inset: 0;
			background-color: rgba(0, 0, 0, 0.8);
			backdrop-filter: blur(8px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 50;
			padding: 1rem;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.modal-overlay.show {
			opacity: 1;
		}

		.modal-content {
			background-color: rgba(255, 255, 255, 0.05);
			backdrop-filter: blur(16px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 1rem;
			max-width: 600px;
			width: 100%;
			max-height: 90vh;
			display: flex;
			flex-direction: column;
			transform: scale(0.9);
			transition: transform 0.3s ease;
		}

		.modal-overlay.show .modal-content {
			transform: scale(1);
		}

		.modal-image-container {
			flex-shrink: 0;
			max-height: 50vh;
			overflow: hidden;
			background-color: #1a1a1a;
		}

		.modal-body {
			flex: 1;
			overflow-y: auto;
			padding: 1.5rem;
		}

		.modal-image {
			width: 100%;
			height: 100%;
			max-height: 50vh;
			aspect-ratio: 5 / 7;
			object-fit: contain;
			background-color: #1a1a1a;
		}

		.btn-secondary {
			background-color: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.15);
			transition: all 0.2s ease;
		}

		.btn-secondary:hover {
			background-color: rgba(255, 255, 255, 0.1);
			border-color: rgba(255, 255, 255, 0.25);
		}

		/* Center grid when 1-2 items */
		.results-centered {
			display: flex;
			justify-content: center;
			gap: 1.5rem;
			flex-wrap: wrap;
		}

		.results-centered .result-card {
			width: 100%;
			max-width: 240px;
		}

		@media (min-width: 640px) {
			.results-centered .result-card {
				max-width: 260px;
			}
		}

		/* Confirmation modal */
		.confirm-modal-content {
			max-width: 450px;
			max-height: 90vh;
			display: flex;
			flex-direction: column;
		}

		.confirm-modal-body {
			flex: 1;
			overflow-y: auto;
			padding: 1.5rem;
		}

		.confirm-modal-image {
			width: 100%;
			max-height: 45vh;
			aspect-ratio: 5 / 7;
			object-fit: cover;
			background-color: #1a1a1a;
		}

		/* NEW HOMEPAGE STYLES */
		.hero-section {
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			padding: 0 1.5rem;
			position: relative;
			overflow: hidden;
		}

		.hero-title {
			font-size: clamp(4rem, 12vw, 8rem);
			font-weight: 700;
			margin-bottom: 1rem;
			line-height: 1;
		}

		.hero-subtitle {
			font-size: clamp(1.25rem, 4vw, 1.75rem);
			color: rgba(255, 255, 255, 0.7);
			margin-bottom: 2rem;
			min-height: 2.5rem;
		}

		.typing-cursor {
			display: inline-block;
			width: 3px;
			background-color: #fff;
			margin-left: 4px;
			animation: blink 1s infinite;
		}

		@keyframes blink {
			0%, 50% { opacity: 1; }
			51%, 100% { opacity: 0; }
		}

		.scroll-indicator {
			position: absolute;
			bottom: 2rem;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			flex-direction: column;
			align-items: center;
			color: rgba(255, 255, 255, 0.5);
			font-size: 0.875rem;
			animation: bounce 2s infinite;
		}

		@keyframes bounce {
			0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
			40% { transform: translateY(-10px) translateX(-50%); }
			60% { transform: translateY(-5px) translateX(-50%); }
		}

		.scroll-indicator svg {
			margin-top: 0.5rem;
		}

		.main-content {
			opacity: 0;
			transform: translateY(20px);
			transition: opacity 0.8s ease, transform 0.8s ease;
		}

		.main-content.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			background-color: rgba(13, 13, 13, 0.9);
			backdrop-filter: blur(10px);
			z-index: 100;
			padding: 1rem 0;
			transform: translateY(-100%);
			transition: transform 0.4s ease;
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
		}

		.header.visible {
			transform: translateY(0);
		}

		.header .logo-font {
			font-size: 1.75rem;
		}

		.header .tagline {
			font-size: 0.75rem;
		}

		.particles {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
		}

		.particle {
			position: absolute;
			background: rgba(59, 130, 246, 0.3);
			border-radius: 50%;
			animation: float 15s infinite linear;
		}

		@keyframes float {
			0% {
				transform: translateY(0) rotate(0deg);
				opacity: 0;
			}
			10% {
				opacity: 1;
			}
			90% {
				opacity: 1;
			}
			100% {
				transform: translateY(-100vh) rotate(360deg);
				opacity: 0;
			}
		}
	</style>
</head>

<body class="min-h-screen">
	<!-- Fixed Header (initially hidden) -->
	<header class="header">
		<div class="max-w-7xl mx-auto px-6 flex flex-col items-center">
			<h1 class="logo-font font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-400 header-glow">
				FINDR.
			</h1>
			<p class="text-gray-500 tagline mt-1 tracking-wide">Lost & Found Made Easy.</p>
		</div>
	</header>

	<!-- Hero Section -->
	<section class="hero-section">
		<div class="particles" id="particles"></div>
		<h1 class="logo-font hero-title text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-indigo-400 header-glow">
			FINDR.
		</h1>
		<div class="hero-subtitle" id="typing-text">
			<span id="typed-text"></span><span class="typing-cursor"></span>
		</div>
		<div class="scroll-indicator">
			Scroll to search
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M12 5V19M12 19L19 12M12 19L5 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>
	</section>

	<!-- Main Content (initially hidden) -->
	<main class="main-content">
		<!-- Search Section -->
		<div class="max-w-4xl mx-auto mb-10 px-6 md:px-10 pt-10">
			<div class="glass-card slide-enter slide-enter-active p-8 md:p-10 shadow-xl">
				<div class="text-center mb-8">
					<h2 class="text-3xl md:text-4xl font-semibold mb-3">Lost an item?</h2>
					<p class="text-gray-400 text-base md:text-lg">Describe what you lost (color, model, brand, etc.)</p>
				</div>

				<div id="queryMessage"></div>

				<form id="queryForm" class="flex flex-col md:flex-row gap-4">
					<input 
						type="text" 
						id="description" 
						placeholder="e.g. black Nike water bottle"
						class="flex-1 px-4 py-3 rounded-lg text-base" 
						required 
					/>
					<button 
						type="submit" 
						id="queryBtn"
						class="btn-primary px-8 py-3 rounded-lg font-semibold text-white whitespace-nowrap">
						Search
					</button>
				</form>
			</div>
		</div>

		<!-- Results Section -->
		<div class="max-w-7xl mx-auto px-6 md:px-10 pb-10">
			<div id="resultsContainer"></div>
		</div>
	</main>

	<!-- Image Modal -->
	<div id="modal" class="modal-overlay hidden">
		<div class="modal-content">
			<div class="modal-image-container">
				<img id="modalImage" src="" alt="Item Image" class="modal-image" />
			</div>
			<div class="modal-body">
				<h3 class="text-2xl font-semibold mb-4">Item Details</h3>
				<div id="modalAiDescription" class="mb-4 text-gray-300 text-lg leading-relaxed"></div>
				<p id="modalScore" class="text-lg text-blue-400 mb-6"></p>
				
				<div class="flex justify-end">
					<button 
						id="closeModalBtn"
						class="btn-secondary px-6 py-2.5 rounded-lg font-semibold text-white">
						Close
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Confirmation Modal -->
	<div id="confirmModal" class="modal-overlay hidden">
		<div class="modal-content confirm-modal-content">
			<div class="confirm-modal-body">
				<h3 class="text-2xl font-semibold mb-3 text-center">Are you sure this is your item?</h3>
				
				<div class="glass-card p-3 mb-5">
					<img id="confirmImage" src="" alt="Item" class="confirm-modal-image rounded-lg mb-2" />
					<p id="confirmDescription" class="text-sm text-gray-300 text-center"></p>
				</div>

				<div class="flex flex-col sm:flex-row gap-3">
					<button 
						id="confirmYesBtn"
						class="btn-primary flex-1 py-2.5 rounded-lg font-semibold text-white">
						Yes, This Is Mine
					</button>
					<button 
						id="confirmNoBtn"
						class="btn-secondary flex-1 py-2.5 rounded-lg font-semibold text-white">
						Cancel
					</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		const API_BASE = "http://127.0.0.1:8000/api/v1";

		// Typing effect variables
		const taglines = [
			"Lost & Found Made Easy.",
			"Find Your Lost Items.",
			"Reuniting People With Their Belongings.",
			"AI-Powered Item Recovery."
		];
		let currentTaglineIndex = 0;
		let currentCharIndex = 0;
		let isDeleting = false;
		let typingSpeed = 100;
		
		// DOM elements
		const form = document.getElementById("queryForm");
		const messageBox = document.getElementById("queryMessage");
		const resultsContainer = document.getElementById("resultsContainer");
		const modal = document.getElementById("modal");
		const modalImage = document.getElementById("modalImage");
		const modalDescription = document.getElementById("modalDescription");
		const modalAiDescription = document.getElementById("modalAiDescription");
		const modalScore = document.getElementById("modalScore");
		const closeModalBtn = document.getElementById("closeModalBtn");

		const confirmModal = document.getElementById("confirmModal");
		const confirmImage = document.getElementById("confirmImage");
		const confirmDescription = document.getElementById("confirmDescription");
		const confirmYesBtn = document.getElementById("confirmYesBtn");
		const confirmNoBtn = document.getElementById("confirmNoBtn");

		const typedTextElement = document.getElementById("typed-text");
		const mainContent = document.querySelector(".main-content");
		const header = document.querySelector(".header");

		let currentItem = null;

		// Initialize the page
		document.addEventListener("DOMContentLoaded", function() {
			// Start typing effect
			typeEffect();
			
			// Create floating particles
			createParticles();
			
			// Set up scroll listener
			window.addEventListener("scroll", handleScroll);
			
			// Initialize search functionality
			initSearch();
		});

		// Typing effect function
		function typeEffect() {
			const currentTagline = taglines[currentTaglineIndex];
			
			if (isDeleting) {
				// Deleting text
				typedTextElement.textContent = currentTagline.substring(0, currentCharIndex - 1);
				currentCharIndex--;
				typingSpeed = 50;
			} else {
				// Typing text
				typedTextElement.textContent = currentTagline.substring(0, currentCharIndex + 1);
				currentCharIndex++;
				typingSpeed = 100;
			}
			
			// Check if we've finished typing the current tagline
			if (!isDeleting && currentCharIndex === currentTagline.length) {
				// Pause at the end of typing
				typingSpeed = 1500;
				isDeleting = true;
			} else if (isDeleting && currentCharIndex === 0) {
				// Move to next tagline
				isDeleting = false;
				currentTaglineIndex = (currentTaglineIndex + 1) % taglines.length;
				typingSpeed = 500;
			}
			
			setTimeout(typeEffect, typingSpeed);
		}

		// Create floating particles
		function createParticles() {
			const particlesContainer = document.getElementById("particles");
			const particleCount = 30;
			
			for (let i = 0; i < particleCount; i++) {
				const particle = document.createElement("div");
				particle.classList.add("particle");
				
				// Random size between 2px and 6px
				const size = Math.random() * 4 + 2;
				particle.style.width = `${size}px`;
				particle.style.height = `${size}px`;
				
				// Random position
				particle.style.left = `${Math.random() * 100}%`;
				particle.style.top = `${Math.random() * 100}%`;
				
				// Random animation duration
				const duration = Math.random() * 20 + 10;
				particle.style.animationDuration = `${duration}s`;
				
				// Random delay
				const delay = Math.random() * 5;
				particle.style.animationDelay = `${delay}s`;
				
				particlesContainer.appendChild(particle);
			}
		}

		// Handle scroll to show/hide content
		function handleScroll() {
			const scrollPosition = window.scrollY;
			const windowHeight = window.innerHeight;
			
			// Show main content when scrolled past 40% of viewport height
			if (scrollPosition > windowHeight * 0.4) {
				mainContent.classList.add("visible");
				header.classList.add("visible");
			} else {
				mainContent.classList.remove("visible");
				header.classList.remove("visible");
			}
		}

		// Initialize search functionality
		function initSearch() {
			// Search form handler
			form.addEventListener("submit", async (e) => {
				e.preventDefault();
				messageBox.innerHTML = "";
				resultsContainer.innerHTML = "";

				const description = document.getElementById("description").value.trim();
				if (!description) {
					messageBox.innerHTML = `<div class="error-message">Please enter a description to search.</div>`;
					return;
				}

				const btn = document.getElementById("queryBtn");
				btn.disabled = true;
				btn.innerHTML = `<div class="spinner"></div> Searching...`;

				try {
					const formData = new FormData();
					formData.append("description", description);

					const res = await fetch(`${API_BASE}/items/query`, {
						method: "POST",
						body: formData,
					});

					const data = await res.json();

					if (!res.ok) {
						messageBox.innerHTML = `<div class="error-message">${data.detail || "No similar items found."}</div>`;
						return;
					}

					if (data.results && data.results.length > 0) {
						messageBox.innerHTML = `<div class="success-message">Found ${data.results.length} similar item(s)</div>`;
						
						// Apply centered layout for 1-2 items, grid for 3+
						if (data.results.length <= 2) {
							resultsContainer.className = "results-centered";
						} else {
							resultsContainer.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6";
						}

						data.results.forEach(item => {
							const card = document.createElement("div");
							card.className = "result-card fade-in";

							card.innerHTML = `
								<img src="${item.image_url}" alt="Item Image" class="result-image" data-view="true" />
								<div class="result-info">
									<p class="result-score mb-2.5 text-sm">Similarity: ${item.score}</p>
									<button class="btn-primary w-full py-2 rounded-lg font-semibold text-white text-sm" data-claim="true">
										Claim Item
									</button>
								</div>
							`;

							// View image on image click
							const img = card.querySelector('[data-view="true"]');
							img.addEventListener("click", () => openModal(item));

							// Claim on button click
							const claimBtn = card.querySelector('[data-claim="true"]');
							claimBtn.addEventListener("click", (e) => {
								e.stopPropagation();
								openConfirmModal(item);
							});

							resultsContainer.appendChild(card);
						});
					} else {
						messageBox.innerHTML = `<div class="error-message">No items found matching your description.</div>`;
					}
				} catch (error) {
					messageBox.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
				} finally {
					btn.disabled = false;
					btn.innerHTML = "Search";
				}
			});

			// Open image modal
			function openModal(item) {
				currentItem = item;
				modalImage.src = item.image_url;
				modalAiDescription.textContent = item.gemini_description || "No AI description available";
				modalScore.textContent = `Similarity Score: ${item.score}`;
				
				modal.classList.remove("hidden");
				setTimeout(() => modal.classList.add("show"), 10);
			}

			// Close image modal
			function closeModal() {
				modal.classList.remove("show");
				setTimeout(() => {
					modal.classList.add("hidden");
					currentItem = null;
				}, 300);
			}

			closeModalBtn.addEventListener("click", closeModal);

			modal.addEventListener("click", (e) => {
				if (e.target === modal) {
					closeModal();
				}
			});

			// Open confirmation modal
			function openConfirmModal(item) {
				currentItem = item;
				confirmImage.src = item.image_url;
				confirmDescription.textContent = item.description || "No description available";
				
				confirmModal.classList.remove("hidden");
				setTimeout(() => confirmModal.classList.add("show"), 10);
			}

			// Close confirmation modal
			function closeConfirmModal() {
				confirmModal.classList.remove("show");
				setTimeout(() => {
					confirmModal.classList.add("hidden");
					currentItem = null;
				}, 300);
			}

			confirmNoBtn.addEventListener("click", closeConfirmModal);

			confirmModal.addEventListener("click", (e) => {
				if (e.target === confirmModal) {
					closeConfirmModal();
				}
			});

			// Confirm claim
			confirmYesBtn.addEventListener("click", () => {
